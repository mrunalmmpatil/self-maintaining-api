[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "api-maintainer"
version = "0.1.0"
description = "Local, evidence-driven API consumer migration"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic>=2.10,<3", "pyyaml>=6,<7", "python-multipart>=0.0.20", "python-dotenv>=1,<2", "strands-agents[openai]>=1,<2", "httpx>=0.28,<1", "openapi-spec-validator>=0.7,<1"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11"]

[project.scripts]
api-maintainer = "api_maintainer.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
